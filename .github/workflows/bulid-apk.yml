name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: cp node_modules/html2canvas/dist/html2canvas.min.js www/
      - run: npx cap add android
      - run: cp native/*.java android/app/src/main/java/com/hejab/factor/
      - run: sed -i '/^dependencies {/a implementation "androidx.print:print:1.0.0"' android/app/build.gradle
      - run: npx @capacitor/assets generate --android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: factor-hejab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
