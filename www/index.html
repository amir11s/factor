<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فاکتور فروشگاه حجاب</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <img src="logo.jpg" class="logo" alt="">
  <div>
    <h1>فاکتور فروشگاه حجاب</h1>
    <p id="meta"></p>
  </div>
</header>
<main>
  <input id="customer" class="field" placeholder="نام مشتری (اختیاری)">
  <div id="rows"></div>
  <button id="add" class="btn ghost">+ افزودن کالا</button>
  <div class="totalbar"><span>مجموع کل</span><b id="grand">۰</b></div>
  <button id="share" class="btn red">ارسال فاکتور (عکس)</button>
  <button id="reset" class="btn dark">فاکتور جدید</button>
</main>
<div id="sheetWrap"><div id="sheet"></div></div>
<script src="html2canvas.min.js"></script>
<script src="app.js"></script>
</body>
</html>
